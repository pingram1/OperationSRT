# Local / beta stack: SPA (Nginx) + API + MongoDB.
# 1. Copy .env.example to server/.env and set secrets (include FRONTEND_URL=http://localhost:8080 when using this compose file).
# 2. docker compose up --build
#
# Web UI: http://localhost:8080  · API direct: http://localhost:3001
#
# Healthcheck strategy:
#   - mongo: mongosh ping every 10s; api waits for service_healthy.
#   - api:   /health endpoint (verifies Mongo connectivity); web waits for service_healthy.
#   - web:   nginx serving / (decoupled from upstream API state).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/startright}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Add a named volume or bind mount here if uploads must survive container recreation.

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
